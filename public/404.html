<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function() {
        // Single Page App redirect for GitHub Pages hosting
        // e.g. https://kheirparham-eng.github.io/The-Clicker/parham -> https://kheirparham-eng.github.io/The-Clicker/#/parham
        var l = window.location;
        var segments = l.pathname.split('/').filter(Boolean);
        var repoName = '';
        var routeName = '';

        if (segments.length >= 2) {
          // Project Pages: e.g. ["The-Clicker", "parham"]
          repoName = '/' + segments[0];
          routeName = '/' + segments.slice(1).join('/');
        } else if (segments.length === 1) {
          // User/Org Pages or Root SPA: e.g. ["parham"]
          repoName = '';
          routeName = '/' + segments[0];
        }

        var redirectUrl = l.protocol + '//' + l.host + repoName + '/#' + routeName + l.search + l.hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
